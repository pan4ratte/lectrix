[package]
name = "pdf-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
mupdf.workspace = true
mupdf-sys.workspace = true
thiserror.workspace = true
uuid = { version = "=1.26.1", features = ["v4"] }
png = "=0.18.1"
# libjpeg (libjpeg-turbo with MozJPEG's encoder), for Compress's JPEG encoder (ADR 0027).
# Already in the tree through the fork's mupdf-sys (ADR 0024), with the same features.
mozjpeg-sys = { version = "=2.2.3", default-features = false, features = ["nasm_simd", "arith_dec", "parallel"] }

[target.'cfg(windows)'.dependencies]
# DirectWrite for the installed-font index (ADR 0005), and the print spooler and GDI for
# printing (ADR 0028). Already in the tree through Tauri.
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Storage_Xps",
] }

[dev-dependencies]
# Reads tests/local-corpus/manifest.json (already in the tree through the app crate).
serde_json = "1"

[build-dependencies]
cc = "=1.5.1"
