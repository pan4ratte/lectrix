[package]
name = "lectrix"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Lectrix PDF editor"

[lib]
name = "lectrix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
pdf-core = { path = "../crates/pdf-core" }
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-single-instance = "=2.5.2"
mupdf.workspace = true
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
ts-rs = "=12.0.1"

[target.'cfg(windows)'.dependencies]
# WebView2's memory target level (ADR 0002). Both already in the tree through Tauri.
webview2-com = "=0.39.1"
windows-core = "=0.62.2"
# Already in the dependency tree through Tauri; used directly by src/platform/windows.rs.
windows-sys = { version = "=0.61.2", features = [
    "Wdk_System_SystemServices",
    "Win32_System_SystemInformation",
] }
