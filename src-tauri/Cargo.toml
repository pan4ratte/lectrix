[package]
name = "lectrix"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Lectrix PDF editor"

[lib]
name = "lectrix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
pdf-core = { path = "../crates/pdf-core" }
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-single-instance = "=2.5.2"
tauri-plugin-updater = "=2.13.1"
mupdf.workspace = true
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1"
# Compares the running version with the last one (What's new). Already in the tree
# through Tauri, whose version type it is (MIT or Apache-2.0).
semver = "=1.0.28"
thiserror.workspace = true
ts-rs = "=12.0.1"

[target.'cfg(windows)'.dependencies]
# WebView2's memory target level (ADR 0002). Both already in the tree through Tauri.
webview2-com = "=0.39.1"
windows-core = "=0.62.2"

[target.'cfg(target_os = "linux")'.dependencies]
# The window's GTK events, to take touchpad pinches from WebKitGTK. Already in the tree
# through Tauri (MIT).
gtk = "=0.18.2"
# The webview's load events, to know when its page covers the window. Already in the
# tree through wry (MIT).
webkit2gtk = "=2.0.2"
# dlsym, for WebKitGTK functions newer than the crate's bindings. Already in the tree
# (MIT or Apache-2.0).
libc = "=0.2.190"
