[workspace]
resolver = "3"
members = ["crates/pdf-core", "crates/pdf-cli", "src-tauri"]
exclude = ["third_party"]

[workspace.package]
# Not the app's version: Lectrix takes that from package.json (ADR 0011).
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.99"

[workspace.dependencies]
# Vendored, patched copy of the mupdf crate; see third_party/mupdf-rs/LECTRIX_PATCHES.md
# and docs/decisions/0001-mupdf-binding-coverage.md.
# Without `system-fonts`: Lectrix's own font index replaces font-kit (ADR 0005).
mupdf = { path = "third_party/mupdf-rs", default-features = false, features = ["base14-fonts", "brotli"] }
# `libjpeg-turbo` is the fork's feature (below): JPEG decoded by libjpeg-turbo, not MuPDF's
# bundled libjpeg (ADR 0024). `html` builds MuPDF's story engine, which lays out Compare's
# report (ADR 0031): Windows' build has it always, Linux's and macOS's only with it.
mupdf-sys = { git = "https://github.com/messense/mupdf-rs", rev = "537d50556ee8e4abf2435f81357dfef3c145d883", default-features = false, features = ["libjpeg-turbo", "html"] }
thiserror = "=2.0.21"

[profile.dev.package."*"]
# MuPDF is large; optimize dependencies even in dev so rendering timings are meaningful.
opt-level = 2


# Lectrix's fork of mupdf-sys: the same MuPDF 1.27.2, with build-time patches so JPEG 2000
# images are decoded at the resolution they are drawn at (ADR 0008), JPEG by
# libjpeg-turbo, its rows copied whole (ADR 0024), text read from fonts without a
# ToUnicode map off their own cmap (ADR 0029), and symbolic Type 1 fonts named by their
# codes read as the standard encoding (ADR 0032). The fork changes mupdf-sys's build
# scripts and manifest and adds mupdf-sys/folio_patches.rs; MuPDF itself is not forked.
[patch."https://github.com/messense/mupdf-rs"]
mupdf-sys = { git = "https://github.com/pan4ratte/mupdf-rs", rev = "849640db9b1b95c66d2c3e0b565078abd6c675b0" }
