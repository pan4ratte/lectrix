name: CI

# Pushes that only touch documentation do not run CI. THIRD_PARTY_*.md are not in the list:
# the installers ship them and the license check reads them. Nor is CHANGELOG.md, which the
# app shows and the tests check.
#
# The Windows checks are separate jobs that run side by side: `checks` (the code by itself)
# and `build` (the app, its installer and the tools that test them), then `interop`,
# `installer` and `e2e` on what `build` made. Every job runs whatever the others do, so
# one run reports every failure, and a job that failed can be run again by itself (the
# end-to-end tests in about 9 minutes) instead of everything.
on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'CONTRIBUTING.md'

env:
  CARGO_TERM_COLOR: always

jobs:
  # The code by itself: formatting, lints, the Rust and frontend tests, licenses.
  checks:
    name: Windows checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      # Shared with the soak run's Rust tests, which only read it.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-debug

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # libjpeg-turbo's SIMD code, in the MuPDF build (ADR 0024).
      - uses: ./.github/actions/install-nasm

      # LLVM (libclang for bindgen) is preinstalled on windows-latest at C:\Program Files\LLVM,
      # which .cargo/config.toml points LIBCLANG_PATH at.
      - name: Install qpdf
        run: choco install qpdf --no-progress -y

      - name: Install JS dependencies
        id: setup
        run: npm ci

      # The checks below run even when an earlier one failed, so one run reports every
      # failure instead of hiding the later ones. Only a failed setup above stops them.
      - name: cargo fmt
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        id: test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cargo test --workspace

      # cargo test writes the generated types.
      - name: Generated IPC types are up to date
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        run: git diff --exit-code -- src/lib/ipc/generated

      - name: svelte-check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check

      - name: Vitest
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npx vitest run

      # The frontend build writes the list of the npm packages it bundles
      # (target/frontend-packages.json), which the license check reads.
      - name: Build the frontend
        id: frontend
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run build

      # Every shipped crate and bundled npm package has an AGPL-compatible license, and
      # THIRD_PARTY_LICENSES.md (installed with the app) is up to date.
      - name: License check
        if: ${{ !cancelled() && steps.frontend.outcome == 'success' }}
        run: python tests/licenses/notices.py --check

  # The release app, its installer, pdf-cli and tauri-driver, as the "windows-build"
  # artifact the three jobs below test.
  build:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-windows

      # For the manual release checklist (docs/manual-checklist.md).
      - uses: actions/upload-artifact@v4
        with:
          name: installers
          path: target/release/bundle/nsis/*.exe

  # The cross-renderer harness (AGENTS.md section 9), on the pdf-cli the build job made.
  interop:
    name: Windows interop
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/interop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install qpdf
        run: choco install qpdf --no-progress -y

      - name: Install JS and Python dependencies
        run: |
          npm ci --prefix tests/interop
          python -m pip install -r tests/interop/requirements.txt

      - uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: target/release

      - name: Interop harness
        id: interop
        shell: pwsh
        run: |
          # Without this, only the last command's exit code would fail the step.
          $PSNativeCommandUseErrorActionPreference = $true
          $env:PATH = "$((Get-ChildItem 'C:\Program Files\qpdf*\bin' | Select-Object -First 1).FullName);$env:PATH"
          python tests/interop/run.py phase0
          python tests/interop/run.py phase2
          python tests/interop/run.py phase3
          python tests/interop/run.py phase4
          python tests/interop/run.py pages
          python tests/interop/run.py phase5

      - name: Upload interop diffs on failure
        if: ${{ !cancelled() && steps.interop.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: interop-output
          path: target/test-output/interop

  # Installs and uninstalls the installer silently, with and without the PDF file
  # registration, and checks the registry (ADR 0007). Then it updates an install made by
  # the 1.1.0 MSI, which it downloads from that release (ADR 0020).
  installer:
    name: Windows installer
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: target/release

      - name: Installer check
        id: installer
        shell: pwsh
        run: ./tests/installer/check.ps1

      - name: Upload installer logs on failure
        if: ${{ !cancelled() && steps.installer.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: installer-logs
          path: target/test-output/installer

  # End-to-end tests (section 9) against the release app the build job made.
  e2e:
    name: Windows end-to-end
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/prepare-e2e

      - name: E2E tests
        id: e2e
        run: npm test --prefix tests/e2e

      - name: Diagnose E2E failure
        if: ${{ !cancelled() && steps.e2e.outcome == 'failure' }}
        shell: pwsh
        run: ./tests/e2e/diagnose.ps1

      - name: Upload E2E output on failure
        if: ${{ !cancelled() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: target/test-output/e2e

  # Build-only jobs for macOS and Linux (AGENTS.md section 9): the app and its tests must
  # compile there. The tests also run, without failing the job, to show what still
  # differs on those platforms (docs/status.md, platform gaps).
  linux:
    runs-on: ubuntu-24.04
    env:
      # .cargo/config.toml points at the Windows LLVM unless this is set.
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
    steps:
      # Debug, test and release builds of MuPDF and WebKitGTK outgrow the runner's free
      # space; drop preinstalled SDKs this job never uses (about 25 GB).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libclang-18-dev qpdf

      # libjpeg-turbo's SIMD code, in the MuPDF build (ADR 0024).
      - uses: ./.github/actions/install-nasm

      - name: Install JS dependencies
        run: npm ci

      - name: Build the workspace and its tests
        run: cargo build --workspace --all-targets

      - name: Build the app
        run: npx tauri build --no-bundle

      # Every test program runs, so one failure doesn't hide the rest.
      - name: Tests (informational)
        continue-on-error: true
        run: cargo test --workspace --no-fail-fast

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # .cargo/config.toml points at the Windows LLVM; use Xcode's libclang instead.
      - name: Find libclang
        run: echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"

      # libjpeg-turbo's SIMD code, in the MuPDF build (ADR 0024).
      - uses: ./.github/actions/install-nasm

      # The structural check of every file the tests write (AGENTS.md section 9).
      - name: Install qpdf
        run: brew install qpdf

      - name: Install JS dependencies
        run: npm ci

      - name: Build the workspace and its tests
        run: cargo build --workspace --all-targets

      - name: Build the app
        run: npx tauri build --no-bundle

      - name: Tests (informational)
        continue-on-error: true
        run: cargo test --workspace --no-fail-fast
